<section class="max-w-2xl">
  <h1 class="text-2xl font-semibold mb-4">Create Article</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Title</label>
      <input formControlName="title" type="text" class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Content</label>
      <textarea formControlName="content" rows="6" class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Excerpt (optional)</label>
      <textarea formControlName="excerpt" rows="2" class="w-full rounded-md border border-slate-300 px-3 py-2"></textarea>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Tags (comma separated)</label>
      <input formControlName="tags" type="text" placeholder="e.g. angular,node,mean" class="w-full rounded-md border border-slate-300 px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Image (optional)</label>
      <input type="file" accept="image/*" (change)="onFileSelected($event)" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Status</label>
      <select formControlName="status" class="w-full rounded-md border border-slate-300 px-3 py-2">
        <option value="draft">Draft</option>
        <option value="published">Published</option>
      </select>
    </div>

    <div class="pt-2">
      <button type="submit" [disabled]="form.invalid || submitting" class="px-4 py-2 rounded-md bg-emerald-600 text-white hover:bg-emerald-700 disabled:opacity-50">
        {{ submitting ? 'Creating...' : 'Create' }}
      </button>
    </div>
  </form>
</section>
