<section class="space-y-4">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold">My Articles</h1>
    <a routerLink="/create-article" class="px-3 py-2 rounded-md bg-emerald-600 text-white hover:bg-emerald-700">New Article</a>
  </div>

  <div *ngIf="loading" class="text-slate-500">Loading...</div>

  <div *ngIf="(articles$ | async) as articles">
    <div *ngIf="articles.length === 0" class="text-slate-500">You have not written any articles yet.</div>
    <ul class="divide-y divide-slate-200">
      <li *ngFor="let a of articles" class="py-4 flex items-start justify-between gap-4">
        <div>
          <a [routerLink]="['/articles', a._id]" class="text-lg font-medium text-slate-900 hover:underline">{{ a.title }}</a>
          <div class="text-sm text-slate-500 mt-1">
            {{ a.status | titlecase }} · {{ a.updatedAt | date:'mediumDate' }}
          </div>
        </div>
        <div class="shrink-0 flex items-center gap-2">
          <a [routerLink]="['/edit-article', a._id]" class="px-3 py-1 rounded-md border border-slate-300 hover:bg-slate-50">Edit</a>
        </div>
      </li>
    </ul>
  </div>
</section>
