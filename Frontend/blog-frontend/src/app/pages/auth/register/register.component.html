<section class="max-w-xl mx-auto mt-10 bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
  <h1 class="text-2xl font-semibold mb-4">Create account</h1>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid gap-3">
    <label class="grid gap-1 font-medium text-slate-800">First name
      <input class="px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400" type="text" formControlName="firstName" />
    </label>
    <label class="grid gap-1 font-medium text-slate-800">Last name
      <input class="px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400" type="text" formControlName="lastName" />
    </label>
    <label class="grid gap-1 font-medium text-slate-800">Email
      <input class="px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400" type="email" formControlName="email" placeholder="you@example.com" />
    </label>
    <label class="grid gap-1 font-medium text-slate-800">Password
      <input class="px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400" type="password" formControlName="password" placeholder="••••••••" />
    </label>
    <label class="grid gap-1 font-medium text-slate-800">Confirm password
      <input class="px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400" type="password" formControlName="confirm" placeholder="••••••••" />
    </label>
    <div class="text-xs text-slate-500" *ngIf="passwordsMismatch">Passwords do not match</div>
    <button class="mt-2 bg-slate-900 text-white rounded-md px-3 py-2 disabled:opacity-60" type="submit" [disabled]="form.invalid || loading || passwordsMismatch">{{ loading ? 'Creating…' : 'Create account' }}</button>
    <div class="text-sm text-red-600" *ngIf="error">{{ error }}</div>
  </form>
</section>
